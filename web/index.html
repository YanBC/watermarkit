<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>watermarkit</title>
  <meta name="description" content="Tile a text watermark across an image, blended into its texture. Runs entirely in your browser.">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>watermarkit</h1>
    <p>Tile a text watermark that blends into the image. Your image never leaves this device.</p>
  </header>

  <main>
    <section class="controls" aria-label="Watermark settings">
      <label class="file">
        <input id="file" type="file" accept="image/*">
        <span>Choose image</span>
      </label>

      <label class="field">
        <span>Text</span>
        <input id="text" type="text" value="FOR VERIFICATION ONLY" autocomplete="off" spellcheck="false">
      </label>

      <label class="field">
        <span>Size <output id="size-out"></output></span>
        <input id="size" type="range" min="1" max="8" step="0.1" value="3.5">
      </label>

      <label class="field">
        <span>Spacing <output id="spacing-out"></output></span>
        <input id="spacing" type="range" min="0.3" max="3" step="0.1" value="1">
      </label>

      <label class="field">
        <span>Strength <output id="strength-out"></output></span>
        <input id="strength" type="range" min="5" max="60" step="1" value="25">
      </label>

      <fieldset class="field">
        <legend>Style</legend>
        <div class="segmented">
          <label><input type="radio" name="mode" value="seamless" checked><span>Blended</span></label>
          <label><input type="radio" name="mode" value="flat"><span>Flat</span></label>
        </div>
      </fieldset>

      <button id="download" type="button" disabled>Download</button>
      <p id="status" class="status" role="status"></p>
    </section>

    <section class="stage" id="stage">
      <div class="empty" id="empty">
        <p><strong>Drop an image here</strong>, paste one, or choose a file.</p>
      </div>
      <canvas id="view" hidden></canvas>
      <button id="compare" type="button" class="compare" hidden>Hold to compare</button>
    </section>
  </main>
  <!-- Vercel Web Analytics of the projects.yanbc.info hub, which serves this app under /watermarkit/. -->
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
